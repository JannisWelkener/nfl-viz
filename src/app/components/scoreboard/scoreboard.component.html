<div class="scoreboard-wrapper">
  <div class="scoreboard">


    <div class="img-wrapper img_left" [ngStyle]='{background: this.team.teamColor(this.analysis.home)}' (click)="selectTeam(true)">
    <img src="https://a.espncdn.com/i/teamlogos/nfl/500/{{analysis.home}}.png"
                  onerror="this.onerror=null;
                  this.src='https://upload.wikimedia.org/wikipedia/en/thumb/6/6f/NFL_Pro_Bowl_logo.svg/640px-NFL_Pro_Bowl_logo.svg.png';"
                  class="team_image"
                  [ngStyle]='{"filter": selectedTeam ? "drop-shadow(0 0 10px #ffffff)" : "none"}'
                  />
    </div>

    <div class="bar bar_left" [ngStyle]='calcMarginHome()' (click)="selectTeam(true)">
      <p class="score">{{scoreHome}}</p>
    </div>




    <div class="bar bar_right" [ngStyle]='calcMarginAway()' (click)="selectTeam(false)">
      <p class="score">{{scoreAway}}</p>
    </div>

    <div class="img-wrapper img_right" [ngStyle]='{background: this.team.teamColor(this.analysis.away)}' (click)="selectTeam(false)">
    <img src="https://a.espncdn.com/i/teamlogos/nfl/500/{{analysis.away}}.png"
                  onerror="this.onerror=null;
                  this.src='https://upload.wikimedia.org/wikipedia/en/thumb/6/6f/NFL_Pro_Bowl_logo.svg/640px-NFL_Pro_Bowl_logo.svg.png';"
                  class="team_image"
                  [ngStyle]='{"filter": !selectedTeam ? "drop-shadow(0 0 10px #ffffff)" : "none"}'/>
   </div>


  </div>
</div>
